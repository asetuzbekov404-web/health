<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GUTSCAN JUNIOR — Баланың іш ауруын бастапқы бағалау</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.12);
      --upper: rgba(239, 68, 68, 0.45);
      --upper-stroke: #dc2626;
      --mid: rgba(245, 158, 11, 0.45);
      --mid-stroke: #d97706;
      --lower: rgba(59, 130, 246, 0.45);
      --lower-stroke: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px 12px 40px;
      line-height: 1.45;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--accent);
      margin: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .vitals-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .vital-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
    }

    .vital-label {
      font-size: 11px;
      color: var(--muted);
    }

    .vital-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .chk:last-child {
      margin-bottom: 0;
    }

    .chk input {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: none;
    }

    .chk:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .diagram-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #f8fafc;
    }

    svg.abdomen-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .zone {
      cursor: pointer;
      transition: opacity 0.15s, filter 0.15s;
      opacity: 0.72;
    }

    .zone:hover,
    .zone:focus-visible {
      opacity: 0.92;
      outline: none;
    }

    .zone.active {
      opacity: 1;
      filter: brightness(1.06);
      stroke-width: 3.5;
    }

    .zone-label {
      font-size: 15px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(15, 23, 42, 0.75);
      stroke-width: 3px;
    }

    .summary-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .summary-text {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .cfg-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .cfg-row input {
      flex: 1;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .cfg-row button {
      padding: 9px 14px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <p class="brand">GUTSCAN JUNIOR</p>
      <p class="subtitle">Баланың іш ауруын бастапқы бағалау</p>

      <div class="vitals-strip">
        <div class="vital-box">
          <div class="vital-label">Пульс (ESP32)</div>
          <div id="bpmOut" class="vital-num">-- BPM</div>
        </div>
        <div class="vital-box">
          <div class="vital-label">Температура (ESP32)</div>
          <div id="tempOut" class="vital-num">--.- °C</div>
        </div>
      </div>
    </div>

    <div class="card">
      <label class="chk">
        <input type="checkbox" id="chkDizziness" value="Бас айналып тұр" />
        <span>Бас айналып тұр</span>
      </label>
      <label class="chk">
        <input type="checkbox" id="chkNausea" value="Жүрегім айнып тұр" />
        <span>Жүрегім айнып тұр</span>
      </label>
    </div>

    <div class="card">
      <div class="diagram-wrap">
        <!-- Анатомическая схема корпуса и 3 зоны живота на казахском -->
        <svg class="abdomen-svg" viewBox="0 0 320 420" role="group" aria-label="Іш аймақтары">
          <defs>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f7d5be" />
              <stop offset="100%" stop-color="#e8b899" />
            </linearGradient>
          </defs>

          <!-- Фон и контур тела -->
          <rect x="0" y="0" width="320" height="420" fill="#f8fafc" />
          <path
            d="M122,22 C122,8 198,8 198,22 L198,56 C225,66 246,92 252,130 L264,255 L240,262 L228,155 L224,398 L172,398 L166,285 L154,285 L148,398 L96,398 L92,155 L80,262 L56,255 L68,130 C74,92 95,66 122,56 Z"
            fill="url(#skinGrad)"
            stroke="#94a3b8"
            stroke-width="2"
          />

          <!-- Көкірек / қабырға сызықтары -->
          <path
            d="M112,115 Q160,132 208,115"
            fill="none"
            stroke="#c28e70"
            stroke-width="2"
          />

          <!-- 1. Жоғарғы іш -->
          <rect
            id="zone-upper"
            class="zone"
            data-zone="Жоғарғы іш"
            x="104"
            y="138"
            width="112"
            height="58"
            rx="14"
            fill="var(--upper)"
            stroke="var(--upper-stroke)"
            stroke-width="2.5"
            tabindex="0"
            role="button"
            aria-pressed="false"
          />
          <text x="160" y="167" class="zone-label">Жоғарғы іш</text>

          <!-- 2. Кіндік маңы -->
          <rect
            id="zone-mid"
            class="zone"
            data-zone="Кіндік маңы"
            x="104"
            y="202"
            width="112"
            height="54"
            rx="14"
            fill="var(--mid)"
            stroke="var(--mid-stroke)"
            stroke-width="2.5"
            tabindex="0"
            role="button"
            aria-pressed="false"
          />
          <text x="160" y="229" class="zone-label">Кіндік маңы</text>

          <!-- Кіндік нүктесі -->
          <circle cx="160" cy="244" r="2.5" fill="#78350f" opacity="0.7" />

          <!-- 3. Төменгі іш -->
          <rect
            id="zone-lower"
            class="zone"
            data-zone="Төменгі іш"
            x="104"
            y="262"
            width="112"
            height="56"
            rx="14"
            fill="var(--lower)"
            stroke="var(--lower-stroke)"
            stroke-width="2.5"
            tabindex="0"
            role="button"
            aria-pressed="false"
          />
          <text x="160" y="290" class="zone-label">Төменгі іш</text>
        </svg>
      </div>
    </div>

    <div class="card">
      <p class="summary-title">Таңдалған белгілер мен аймақтар:</p>
      <p id="summaryText" class="summary-text">Әзірге ештеңе таңдалған жоқ.</p>
      <div id="selectedPills" class="pill-list"></div>
    </div>

    <div class="card">
      <p class="summary-title">ESP32 дерек көзі (міндетті емес):</p>
      <div class="cfg-row">
        <input id="jsonUrl" type="url" placeholder="https://.../data.json (бос болса — демо)" />
        <button id="applyUrl" type="button">Қосу</button>
      </div>
    </div>
  </div>

  <script>
    const checkboxes = Array.from(document.querySelectorAll('.chk input[type="checkbox"]'));
    const zones = Array.from(document.querySelectorAll('.zone'));
    const summaryText = document.getElementById('summaryText');
    const selectedPills = document.getElementById('selectedPills');
    const bpmOut = document.getElementById('bpmOut');
    const tempOut = document.getElementById('tempOut');
    const jsonUrlInput = document.getElementById('jsonUrl');

    const activeZones = new Set();
    let apiUrl = localStorage.getItem('gutscan_kk_api') || '';
    jsonUrlInput.value = apiUrl;

    function updateSummary() {
      const checkedItems = checkboxes.filter((c) => c.checked).map((c) => c.value);
      const zoneItems = Array.from(activeZones);
      const all = [...checkedItems, ...zoneItems];

      selectedPills.innerHTML = '';
      if (all.length === 0) {
        summaryText.textContent = 'Әзірге ештеңе таңдалған жоқ.';
        return;
      }

      summaryText.textContent = `Таңдалды (${all.length}):`;
      all.forEach((label) => {
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = label;
        selectedPills.appendChild(span);
      });
    }

    checkboxes.forEach((chk) => {
      chk.addEventListener('change', updateSummary);
    });

    zones.forEach((z) => {
      const name = z.dataset.zone;
      const toggleZone = () => {
        if (activeZones.has(name)) {
          activeZones.delete(name);
          z.classList.remove('active');
          z.setAttribute('aria-pressed', 'false');
        } else {
          activeZones.add(name);
          z.classList.add('active');
          z.setAttribute('aria-pressed', 'true');
        }
        updateSummary();
      };

      z.addEventListener('click', toggleZone);
      z.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleZone();
        }
      });
    });

    document.getElementById('applyUrl').addEventListener('click', () => {
      apiUrl = jsonUrlInput.value.trim();
      localStorage.setItem('gutscan_kk_api', apiUrl);
      pollVitals();
    });

    async function pollVitals() {
      if (!apiUrl) {
        const s = Date.now() / 1000;
        const bpm = Math.round(76 + Math.sin(s * 0.7) * 4);
        const temp = (36.5 + Math.cos(s / 8) * 0.2).toFixed(1);
        bpmOut.textContent = `${bpm} BPM`;
        tempOut.textContent = `${temp} °C`;
        return;
      }

      try {
        const res = await fetch(apiUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error();
        const d = await res.json();
        const raw = d && d.latest ? d.latest : d;
        bpmOut.textContent = raw.finger && raw.bpm ? `${Math.round(raw.bpm)} BPM` : '-- BPM';
        tempOut.textContent = raw.temp !== undefined ? `${Number(raw.temp).toFixed(1)} °C` : '--.- °C';
      } catch (_) {
        bpmOut.textContent = '-- BPM';
        tempOut.textContent = '--.- °C';
      }
    }

    updateSummary();
    pollVitals();
    setInterval(pollVitals, 1500);
  </script>
</body>
</html>
