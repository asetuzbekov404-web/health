<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GutScan Junior — Мониторинг пульса и температуры</title>
  <style>
    :root {
      --bg: #0f131a;
      --card: #171d27;
      --card-2: #1e2634;
      --line: #2a3446;
      --ink: #f3f6fb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #182232 0%, var(--bg) 60%);
      color: var(--ink);
      padding: 20px 14px 40px;
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
    }

    .dot.err {
      background: var(--danger);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .metric-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .metric-val {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--accent);
    }

    .metric-unit {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-pill {
      padding: 5px 10px;
      border-radius: 10px;
      background: var(--card-2);
      color: var(--ink);
      font-weight: 600;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 0;
      background: var(--accent);
      color: #081018;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: var(--card-2);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .qr-box img {
      width: 184px;
      height: 184px;
      padding: 10px;
      background: #ffffff;
      border-radius: 14px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }

    @media (max-width: 460px) {
      .grid, .row-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <h1>GutScan Junior</h1>
        <p class="sub">Пульс и температура с датчиков ESP32</p>
      </div>
      <div class="badge">
        <span id="statusDot" class="dot"></span>
        <span id="modeBadge">DEMO</span>
      </div>
    </div>

    <div class="grid">
      <div class="card" style="margin-bottom:0;">
        <div class="metric-label">Пульс</div>
        <div id="bpmVal" class="metric-val">--<span class="metric-unit">BPM</span></div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <div class="metric-label">Температура</div>
        <div id="tempVal" class="metric-val">--.-<span class="metric-unit">°C</span></div>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span>Состояние датчика: <strong id="fingerText">Ожидание...</strong></span>
        <span id="ambientText" class="status-pill">Среда: --.- °C</span>
      </div>
      <p class="hint" id="lastSync" style="margin-top:10px;">Последнее обновление: —</p>
    </div>

    <div class="card">
      <h2>Источник данных ESP32</h2>
      <label for="sourceMode">Режим работы</label>
      <select id="sourceMode">
        <option value="demo">Демо-данные (тест интерфейса)</option>
        <option value="api">Реальный API / JSON URL</option>
      </select>

      <label for="apiUrl">URL JSON-эндпоинта (GET)</label>
      <input
        id="apiUrl"
        type="url"
        placeholder="https://example.com/api/latest.json"
      />

      <div class="row-2">
        <button id="saveBtn" type="button">Сохранить и обновить</button>
        <button id="refreshBtn" class="secondary" type="button">Обновить сейчас</button>
      </div>
      <p class="hint" style="margin-top:10px;">
        Ожидаемый формат JSON: <code>{"bpm":76,"finger":true,"temp":36.6,"ambient":23.4}</code>
      </p>
    </div>

    <div class="card qr-box">
      <h2 style="margin-bottom:2px;">QR-код для открытия сайта</h2>
      <img id="qrImg" alt="QR-код сайта" />
      <p class="hint" id="qrUrlText"></p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "gutscan_junior_config_v1";

    const bpmEl = document.getElementById("bpmVal");
    const tempEl = document.getElementById("tempVal");
    const fingerEl = document.getElementById("fingerText");
    const ambientEl = document.getElementById("ambientText");
    const lastSyncEl = document.getElementById("lastSync");
    const statusDot = document.getElementById("statusDot");
    const modeBadge = document.getElementById("modeBadge");
    const modeSelect = document.getElementById("sourceMode");
    const apiInput = document.getElementById("apiUrl");
    const qrImg = document.getElementById("qrImg");
    const qrUrlText = document.getElementById("qrUrlText");

    let config = {
      mode: "demo",
      apiUrl: ""
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (saved.mode) config.mode = saved.mode;
      if (typeof saved.apiUrl === "string") config.apiUrl = saved.apiUrl;
    } catch (_) {}

    modeSelect.value = config.mode;
    apiInput.value = config.apiUrl;

    function renderQr() {
      const currentUrl = window.location.href;
      qrUrlText.textContent = currentUrl;
      qrImg.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
        encodeURIComponent(currentUrl);
    }

    function applyTelemetry(data) {
      const finger = Boolean(data.finger);
      const bpm = Number(data.bpm || 0);
      const temp = Number(data.temp || 0);
      const ambient = data.ambient !== undefined ? Number(data.ambient) : null;

      bpmEl.innerHTML = (finger && bpm > 0 ? Math.round(bpm) : "--") +
        '<span class="metric-unit">BPM</span>';
      tempEl.innerHTML = (Number.isFinite(temp) ? temp.toFixed(1) : "--.-") +
        '<span class="metric-unit">°C</span>';

      fingerEl.textContent = finger ? "Палец определён" : "Палец не приложен";
      ambientEl.textContent =
        ambient !== null && Number.isFinite(ambient)
          ? `Среда: ${ambient.toFixed(1)} °C`
          : "Среда: --.- °C";

      lastSyncEl.textContent = "Последнее обновление: " + new Date().toLocaleTimeString();
    }

    function getDemoTelemetry() {
      const t = Date.now() / 1000;
      const finger = Math.sin(t / 12) > -0.6;
      const bpm = finger ? Math.round(74 + Math.sin(t * 0.8) * 5) : 0;
      const temp = 36.4 + Math.sin(t / 7) * 0.3;
      const ambient = 23.2 + Math.cos(t / 15) * 0.2;
      return { bpm, finger, temp, ambient };
    }

    async function tick() {
      if (config.mode === "demo" || !config.apiUrl.trim()) {
        statusDot.className = "dot";
        modeBadge.textContent = "DEMO";
        applyTelemetry(getDemoTelemetry());
        return;
      }

      modeBadge.textContent = "LIVE";
      try {
        const res = await fetch(config.apiUrl.trim(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const raw = await res.json();
        // Поддерживаем как прямой объект, так и вложенный { latest: {...} }
        const data = raw && typeof raw === "object" && raw.latest ? raw.latest : raw;
        statusDot.className = "dot live";
        applyTelemetry(data);
      } catch (err) {
        statusDot.className = "dot err";
        lastSyncEl.textContent = "Ошибка загрузки данных: " + err.message;
      }
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      config = {
        mode: modeSelect.value,
        apiUrl: apiInput.value.trim()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      tick();
    });

    document.getElementById("refreshBtn").addEventListener("click", tick);

    renderQr();
    tick();
    setInterval(tick, 1500);
  </script>
</body>
</html>
